name: Workshop discussion topic
description: Propose a topic or question for a group meeting or the workshop.
title: "[Discussion] "
labels: ["discussion"]
body:
  - type: textarea
    id: topic
    attributes:
      label: Topic or question
      description: One topic per issue, phrased so others can answer it.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Background and links
      description: Papers, datasets, images, or files in this repository (give the path).
  - type: dropdown
    id: part
    attributes:
      label: Part of the session work
      options:
        - "Assignment I: LLM benchmark"
        - "Assignment II: consensus and ground truth"
        - Presentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: when
    attributes:
      label: Where should we discuss it?
      options:
        - Next group meeting
        - Workshop session
        - Here, in the comments
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a useful outcome be?
      description: A decision, a list of options, an experiment to run, a section for the report…
