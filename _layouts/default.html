<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title contains "Group 5" %}{{ page.title }}{% elsif page.title %}{{ page.title }} · GloBIAS 2026 · Group 5{% else %}GloBIAS 2026 · Group 5{% endif %}</title>
<style>
/* Same design tokens as the org website (globias-2026-group5.github.io). */
:root {
  --bg: #fcfcfb; --surface: #ffffff; --ink: #0b0b0b; --ink2: #52514e; --ink3: #7a7975;
  --line: #e4e3df; --accent: #2a78d6; --accent-ink: #1f5fae; --warm: #eb6834; --tile: #f4f3f0;
  --maxw: 1040px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --surface: #1f1f1e; --ink: #f0efec; --ink2: #c3c2b7; --ink3: #9a998f;
          --line: #34332f; --accent: #3987e5; --accent-ink: #7fb2f0; --warm: #d95926; --tile: #262624; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
a { color: var(--accent-ink); text-underline-offset: 2px; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 16px; }
header { border-bottom: 1px solid var(--line); }
header .wrap { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; padding-top: 18px; padding-bottom: 14px; }
.brand { font-weight: 700; letter-spacing: .01em; color: var(--ink); text-decoration: none; }
nav a { color: var(--ink2); text-decoration: none; margin-left: 18px; font-size: 15px; }
nav a:first-child { margin-left: 0; }
nav a:hover, nav a.here { color: var(--ink); }
footer { border-top: 1px solid var(--line); padding: 24px 0 40px; color: var(--ink3); font-size: 14px; margin-top: 48px; }

/* Rendered Markdown */
article { padding: 40px 0 0; }
article > :first-child { margin-top: 0; }
article h1 { font-size: clamp(28px, 4.2vw, 42px); line-height: 1.15; margin: 0 0 16px; letter-spacing: -.01em; }
article h2 { font-size: 26px; line-height: 1.25; margin: 44px 0 14px; letter-spacing: -.005em; }
article hr + h2 { margin-top: 0; }
article h3 { font-size: 19px; line-height: 1.3; margin: 30px 0 8px; }
article h4 { font-size: 16px; margin: 24px 0 6px; }
article p, article li { color: var(--ink2); }
article strong, article b { color: var(--ink); }
article p { margin: 0 0 14px; }
article ul, article ol { padding-left: 22px; margin: 0 0 16px; }
article li { margin-bottom: 6px; }
article hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
article sub { line-height: 1.4; }
article img { max-width: 100%; height: auto; display: block; margin: 0 auto;
              background: #fcfcfb; border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
article p > img:only-child { margin: 18px auto 8px; }
article blockquote { margin: 0 0 16px; padding: 14px 18px; background: var(--tile); border-radius: 12px; }
article blockquote p:last-child { margin: 0; }
article code { font: 13.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
               background: var(--tile); border-radius: 5px; padding: 1px 5px; }
article pre { background: var(--tile); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
              overflow-x: auto; margin: 0 0 16px; }
article pre code { background: none; padding: 0; font-size: 13px; }
article table { display: block; overflow-x: auto; border-collapse: collapse; margin: 0 0 18px; font-size: 14.5px; max-width: 100%; }
article th, article td { border-bottom: 1px solid var(--line); padding: 8px 12px; text-align: left; vertical-align: top; }
article th { color: var(--ink); font-weight: 600; border-bottom-width: 2px; white-space: nowrap; }
article td { color: var(--ink2); }
article details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin: 0 0 12px; }
article summary { cursor: pointer; font-weight: 600; color: var(--ink); }
article details[open] summary { margin-bottom: 10px; }
article details > :last-child { margin-bottom: 0; }
@media (max-width: 820px) {
  nav a { margin-left: 12px; }
  article { padding-top: 28px; }
  article h2 { font-size: 23px; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="https://globias-2026-group5.github.io/">GloBIAS 2026 · Group 5</a>
    <nav>
      <a href="https://globias-2026-group5.github.io/agent-benchmark-ilastik-tracking/"{% if site.github.repository_name == "agent-benchmark-ilastik-tracking" %} class="here"{% endif %}>Benchmark</a>
      <a href="https://globias-2026-group5.github.io/ilastik-mitocheck-run/"{% if site.github.repository_name == "ilastik-mitocheck-run" %} class="here"{% endif %}>Original run</a>
      <a href="{{ site.github.repository_url }}">Repository</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <article>
{{ content }}
  </article>
</main>
<footer>
  <div class="wrap">
    Group work for the GloBIAS 2026 workshop; not an official GloBIAS site. Data courtesy of the MitoCheck
    project (movie 94570); example and projects from <a href="https://www.ilastik.org">ilastik</a>.
    Source: <a href="{{ site.github.repository_url }}">{{ site.github.repository_nwo }}</a>.
  </div>
</footer>
</body>
</html>
